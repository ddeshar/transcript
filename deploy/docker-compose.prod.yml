name: ${PROJECT_NAME:-transcript}

services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    image: ${IMAGE:-transcript-app:local}
    container_name: transcript-app
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: /app
      AUDIO_STORAGE_PATH: /app/media/audio
      LOG_DIR: /app/logs
      SUBTITLE_DIR: /app/subtitles
      DATABASE_URL: ${DATABASE_URL:-postgresql://seminar_user:seminar_pass@db:5432/seminar_platform}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    volumes:
      - ../media:/app/media
      - ../logs:/app/logs
      - ../subtitles:/app/subtitles
      - ../models:/app/models
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.trans.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.trans.entrypoints=websecure"
      - "traefik.http.routers.trans.tls.certresolver=le"
      - "traefik.docker.network=${PROJECT_NAME:-transcript}_proxy"
      - "traefik.http.routers.trans-web.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.trans-web.entrypoints=web"
      - "traefik.http.routers.trans-web.middlewares=redirect-https@docker"
      - "traefik.http.middlewares.redirect-https.redirectscheme.scheme=https"
      - "traefik.http.middlewares.redirect-https.redirectscheme.permanent=true"
      - "traefik.http.services.trans.loadbalancer.server.port=8000"
    networks:
      - default
      - proxy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python - <<'PY'\nimport urllib.request,sys\ntry:\n  urllib.request.urlopen('http://localhost:8000/health',timeout=3)\n  print('OK')\nexcept Exception as e:\n  print(e); sys.exit(1)\nPY"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    security_opt:
      - no-new-privileges:true
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp:size=64m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 6g
        reservations:
          cpus: "1.0"
          memory: 3g

  portainer:
    image: portainer/portainer-ce:latest
    container_name: transcript-portainer
    restart: unless-stopped
    ports:
      - "9443:9443"
    command:
      - --http-disabled
      - --assets-dir=/public
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  db:
    image: postgres:15-alpine
    container_name: transcript-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-seminar_platform}
      POSTGRES_USER: ${POSTGRES_USER:-seminar_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-seminar_pass}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ../scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-seminar_user} -d ${POSTGRES_DB:-seminar_platform}"]
      interval: 10s
      timeout: 5s
      retries: 5
    shm_size: "256m"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 2g

  redis:
    image: redis:7-alpine
    container_name: transcript-redis
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: transcript-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin123}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ../scripts/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      db:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  traefik:
    image: traefik:v2.11
    container_name: transcript-traefik
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.le.acme.email=${TRAEFIK_ACME_EMAIL}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.le.acme.httpchallenge=true
      - --certificatesresolvers.le.acme.httpchallenge.entrypoint=web
      - --api.dashboard=false
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/letsencrypt/acme.json:/letsencrypt/acme.json
    networks:
      - proxy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  db_data:
  redis_data:
  pgadmin_data:
  portainer_data:

networks:
  default:
    driver: bridge
    name: ${PROJECT_NAME:-transcript}_default
  proxy:
    driver: bridge
    name: ${PROJECT_NAME:-transcript}_proxy
