version: "3.9"

services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: en-th-subtitles
    env_file:
      - ../.env
    ports:
      - "8000:8000"
    volumes:
      - ../models:/app/models
      - ../sample_audio:/app/sample_audio:ro
      - ../frontend:/app/frontend:ro
    restart: unless-stopped

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: en-th-subtitles-frontend
    depends_on:
      - app
    ports:
      - "5173:80"
    restart: unless-stopped
