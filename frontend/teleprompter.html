<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Teleprompter</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@100..900&family=Noto+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/styles.css" />
    <style>
      body { background: #000; }
      .teleprompter {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        color: #e6e6e6;
      }
      .tp-line {
        width: min(1400px, 92vw);
        line-height: 1.35;
        letter-spacing: 0.2px;
        text-align: center;
        margin: 1.2rem 0;
        white-space: pre-wrap;
        word-break: break-word;
        transition: opacity 160ms ease;
      }
      .tp-thai { font-weight: 700; font-size: clamp(2rem, 6vw, 4.25rem); }
      .tp-english { opacity: 0.6; font-size: clamp(1.2rem, 3.5vw, 2rem); }
      .toolbar {
        position: fixed;
        top: 12px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 8px;
        background: rgba(20,20,20,0.7);
        padding: 8px 12px;
        border-radius: 999px;
        border: 1px solid rgba(255,255,255,0.08);
        backdrop-filter: blur(8px);
      }
      .toolbar input[type="checkbox"] { margin-left: 6px; }
      .session-tag {
        padding: 4px 10px;
        border-radius: 999px;
        border: 1px solid rgba(0, 255, 136, 0.3);
        background: rgba(0, 0, 0, 0.3);
        color: #00ff88;
        font-size: 0.9rem;
      }
      .session-tag.session-missing {
        border-color: rgba(255, 170, 0, 0.3);
        color: #ffb347;
      }
      .mirror { transform: scaleX(-1); }
    </style>
  </head>
  <body>
    <div class="toolbar">
      <span id="sessionInfo" class="session-tag">Session: —</span>
      <button id="startBtn" class="btn">Connect</button>
      <button id="stopBtn" class="btn" disabled>Disconnect</button>
      <label><input type="checkbox" id="showEnglish" checked> EN preview</label>
      <label><input type="checkbox" id="mirrorMode"> Mirror</label>
      <select id="sizeSelect">
        <option value="sm">Small</option>
        <option value="md" selected>Medium</option>
        <option value="lg">Large</option>
      </select>
    </div>

    <div id="tp" class="teleprompter">
      <div id="tpThai" class="tp-line tp-thai">…</div>
      <div id="tpEnglish" class="tp-line tp-english"></div>
    </div>

    <script>
      const TARGET_SAMPLE_RATE = 16000;
      let ws = null;
      let showEnglish = true;
      let activeSession = null;
      let heartbeatInterval = null;

      const el = {
        thai: document.getElementById('tpThai'),
        english: document.getElementById('tpEnglish'),
        start: document.getElementById('startBtn'),
        stop: document.getElementById('stopBtn'),
        mirror: document.getElementById('mirrorMode'),
        size: document.getElementById('sizeSelect'),
        sessionInfo: document.getElementById('sessionInfo'),
        container: document.getElementById('tp'),
      };

      function setSessionInfo(session) {
        if (session) {
          el.sessionInfo.textContent = `Session: ${session}`;
          el.sessionInfo.classList.remove('session-missing');
        } else {
          el.sessionInfo.textContent = 'No active session';
          el.sessionInfo.classList.add('session-missing');
        }
      }

      function connect(sessionId) {
        const protocol = location.protocol === 'https:' ? 'wss' : 'ws';
        ws = new WebSocket(`${protocol}://${location.host}/ws/follow/${sessionId}`);
        ws.binaryType = 'arraybuffer';
        ws.onopen = () => {
          activeSession = sessionId;
          setSessionInfo(sessionId);
          // Start heartbeat to keep connection alive
          if (heartbeatInterval) clearInterval(heartbeatInterval);
          heartbeatInterval = setInterval(() => {
            if (ws && ws.readyState === WebSocket.OPEN) {
              // Send ping to keep connection alive
              ws.send(JSON.stringify({ type: 'ping' }));
            }
          }, 30000); // Every 30 seconds
        };
        ws.onmessage = (ev) => {
          try {
            const msg = JSON.parse(ev.data);
            if (msg.type === 'partial' || msg.type === 'final') {
              el.thai.textContent = msg.thai || '';
              if (showEnglish) el.english.textContent = msg.english || '';
              else el.english.textContent = '';
              if (msg.type === 'final') {
                // brief fade to hint final
                el.thai.style.opacity = '0.9';
                setTimeout(()=>{ el.thai.style.opacity = '1'; }, 120);
              }
            }
          } catch {}
        };
        ws.onclose = () => {
          console.log('WebSocket closed, attempting reconnect...');
          // Auto-reconnect if we have an active session
          if (activeSession) {
            setTimeout(() => {
              if (!ws || ws.readyState === WebSocket.CLOSED) {
                console.log('Reconnecting to session:', activeSession);
                connect(activeSession);
              }
            }, 2000);
          } else {
            stop();
          }
        };
      }

      async function start(sessionId) {
        if (!sessionId) {
          alert('Teleprompter must be opened from the main page using the Teleprompter link.');
          return;
        }
        if (ws && ws.readyState === WebSocket.OPEN) return;
        connect(sessionId);
        el.start.disabled = true;
        el.stop.disabled = false;
      }

      function stop() {
        if (ws) {
          try { ws.close(); } catch (_) {}
          ws = null;
        }
        if (heartbeatInterval) {
          clearInterval(heartbeatInterval);
          heartbeatInterval = null;
        }
        el.start.disabled = false;
        el.stop.disabled = true;
        // Don't clear activeSession here - keep it for reconnection
        setSessionInfo(null);
      }

      // UI bindings
      document.getElementById('showEnglish').addEventListener('change', (e)=>{
        showEnglish = e.target.checked;
        if (!showEnglish) el.english.textContent = '';
      });
      el.mirror.addEventListener('change', (e)=>{
        if (e.target.checked) el.container.classList.add('mirror');
        else el.container.classList.remove('mirror');
      });
      el.size.addEventListener('change', (e)=>{
        const v = e.target.value;
        if (v === 'sm') { el.thai.style.fontSize = 'clamp(1.6rem, 5vw, 3rem)'; }
        if (v === 'md') { el.thai.style.fontSize = 'clamp(2rem, 6vw, 4.25rem)'; }
        if (v === 'lg') { el.thai.style.fontSize = 'clamp(2.6rem, 8vw, 6rem)'; }
      });

      el.start.addEventListener('click', ()=> {
        const params = new URLSearchParams(location.search);
        start(params.get('follow'));
      });
      el.stop.addEventListener('click', ()=> stop());

      window.addEventListener('beforeunload', ()=> stop());

      // Add page visibility change handler for tab switching
      document.addEventListener('visibilitychange', () => {
        if (!document.hidden && activeSession && (!ws || ws.readyState !== WebSocket.OPEN)) {
          console.log('Page became visible, reconnecting...');
          connect(activeSession);
        }
      });

      (function init() {
        const params = new URLSearchParams(location.search);
        const session = params.get('follow');
        setSessionInfo(session);
        if (session) {
          start(session);
        } else {
          el.start.disabled = true;
          el.stop.disabled = true;
        }
      })();
    </script>
  </body>
</html>
