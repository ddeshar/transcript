<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Provider Configuration - Dependency Dropdown</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@100..900&family=Noto+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: "Noto Sans Thai", "Noto Sans", 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background: #1a1a1a;
            color: #e0e0e0;
        }
        
        .container {
            background: #2d2d2d;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        
        h1 {
            color: #4CAF50;
            text-align: center;
            margin-bottom: 30px;
        }
        
        .provider-section {
            margin: 25px 0;
            padding: 20px;
            background: #3a3a3a;
            border-radius: 8px;
            border-left: 4px solid #4CAF50;
        }
        
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: #4CAF50;
        }
        
        select {
            width: 100%;
            padding: 12px;
            border: 2px solid #555;
            border-radius: 6px;
            background: #444;
            color: #e0e0e0;
            font-size: 14px;
            margin-bottom: 15px;
        }
        
        select:focus {
            border-color: #4CAF50;
            outline: none;
        }
        
        .provider-info {
            background: #4a4a4a;
            border-radius: 6px;
            padding: 15px;
            margin-top: 10px;
            border-left: 3px solid #2196F3;
        }
        
        .status-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
        }
        
        .status-optimal { background: #4CAF50; }
        .status-warning { background: #FF9800; }
        .status-error { background: #F44336; }
        
        .dependency-note {
            font-style: italic;
            color: #bbb;
            font-size: 13px;
            margin-top: 10px;
        }
        
        .current-config {
            background: #1e3a1e;
            border: 2px solid #4CAF50;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 25px;
        }
        
        .provider-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin: 20px 0;
        }
        
        @media (max-width: 600px) {
            .provider-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎯 Provider Configuration with Dependencies</h1>
        
        <div class="current-config">
            <h3>✅ Current Configuration</h3>
            <div id="currentStatus">Loading...</div>
        </div>
        
        <div class="provider-grid">
            <div class="provider-section">
                <label for="asrSelect">ASR Provider (Speech Recognition):</label>
                <select id="asrSelect">
                    <option value="">Loading...</option>
                </select>
                <div id="asrInfo" class="provider-info" style="display: none;"></div>
            </div>
            
            <div class="provider-section">
                <label for="mtSelect">MT Provider (Translation):</label>
                <select id="mtSelect">
                    <option value="">Loading...</option>
                </select>
                <div id="mtInfo" class="provider-info" style="display: none;"></div>
            </div>
        </div>
        
        <div id="compatibilityStatus" class="provider-info" style="display: none;">
            <h4>🔗 Compatibility Analysis</h4>
            <div id="compatibilityDetails"></div>
        </div>
    </div>

    <script>
        let providerData = null;
        
        async function loadProviderData() {
            try {
                const response = await fetch('/api/settings');
                providerData = await response.json();
                updateCurrentStatus();
                populateDropdowns();
            } catch (error) {
                console.error('Failed to load provider data:', error);
            }
        }
        
        function updateCurrentStatus() {
            const current = providerData.current;
            const asrInfo = providerData.dependencies?.asr_mt_compatibility[current.asr_provider];
            const requiresMt = asrInfo?.requires_mt !== false;
            const recommended = asrInfo?.recommended_mt;
            const isOptimal = current.mt_provider === recommended;
            
            const statusIcon = isOptimal ? '✅' : '⚠️';
            const statusText = isOptimal ? 'Optimal' : 'Non-optimal';
            
            document.getElementById('currentStatus').innerHTML = `
                <strong>ASR:</strong> ${current.asr_provider} <br>
                <strong>MT:</strong> ${current.mt_provider} <br>
                <strong>Status:</strong> <span class="status-indicator ${isOptimal ? 'status-optimal' : 'status-warning'}"></span>${statusIcon} ${statusText}
                ${!isOptimal ? `<br><small>💡 Recommended MT: ${recommended}</small>` : ''}
            `;
        }
        
        function populateDropdowns() {
            const asrSelect = document.getElementById('asrSelect');
            const mtSelect = document.getElementById('mtSelect');
            
            // Populate ASR dropdown
            asrSelect.innerHTML = '';
            providerData.available.asr_providers.forEach(provider => {
                const option = document.createElement('option');
                option.value = provider;
                option.textContent = provider;
                if (provider === providerData.current.asr_provider) {
                    option.selected = true;
                }
                asrSelect.appendChild(option);
            });
            
            // Populate MT dropdown initially
            updateMtDropdown();
            
            // Add event listeners
            asrSelect.addEventListener('change', onAsrChange);
            mtSelect.addEventListener('change', onMtChange);
            
            // Show initial info
            showAsrInfo();
            showMtInfo();
            updateCompatibilityStatus();
        }
        
        function updateMtDropdown() {
            const mtSelect = document.getElementById('mtSelect');
            const selectedAsr = document.getElementById('asrSelect').value;
            const asrInfo = providerData.dependencies?.asr_mt_compatibility[selectedAsr];
            
            mtSelect.innerHTML = '';
            
            if (asrInfo && !asrInfo.requires_mt) {
                // ASR does translation internally
                const option = document.createElement('option');
                option.value = asrInfo.recommended_mt || 'simple_thai';
                option.textContent = `${option.value} (automatic)`;
                option.selected = true;
                mtSelect.appendChild(option);
                mtSelect.disabled = true;
            } else {
                mtSelect.disabled = false;
                
                // Show compatible MT providers
                const compatibleMt = asrInfo?.compatible_mt || providerData.available.mt_providers;
                const recommended = asrInfo?.recommended_mt;
                
                compatibleMt.forEach(provider => {
                    if (providerData.available.mt_providers.includes(provider)) {
                        const option = document.createElement('option');
                        option.value = provider;
                        option.textContent = provider + (provider === recommended ? ' (recommended)' : '');
                        if (provider === providerData.current.mt_provider || provider === recommended) {
                            option.selected = true;
                        }
                        mtSelect.appendChild(option);
                    }
                });
            }
        }
        
        function onAsrChange() {
            updateMtDropdown();
            showAsrInfo();
            showMtInfo();
            updateCompatibilityStatus();
        }
        
        function onMtChange() {
            showMtInfo();
            updateCompatibilityStatus();
        }
        
        function showAsrInfo() {
            const selectedAsr = document.getElementById('asrSelect').value;
            const asrInfo = providerData.dependencies?.asr_mt_compatibility[selectedAsr];
            const infoDiv = document.getElementById('asrInfo');
            
            if (asrInfo) {
                const categories = providerData.dependencies.provider_categories;
                let category = 'Unknown';
                for (const [cat, providers] of Object.entries(categories)) {
                    if (providers.includes(selectedAsr)) {
                        category = cat.replace('_', ' ').toUpperCase();
                        break;
                    }
                }
                
                infoDiv.innerHTML = `
                    <strong>${selectedAsr}</strong><br>
                    <small>${asrInfo.description}</small><br>
                    <div class="dependency-note">
                        📂 Category: ${category}<br>
                        🔗 Requires MT: ${asrInfo.requires_mt ? 'Yes' : 'No'}<br>
                        💡 Best MT: ${asrInfo.recommended_mt}
                    </div>
                `;
                infoDiv.style.display = 'block';
            }
        }
        
        function showMtInfo() {
            const selectedMt = document.getElementById('mtSelect').value;
            const infoDiv = document.getElementById('mtInfo');
            
            const categories = providerData.dependencies.provider_categories;
            let category = 'Unknown';
            for (const [cat, providers] of Object.entries(categories)) {
                if (providers.includes(selectedMt)) {
                    category = cat.replace('_', ' ').toUpperCase();
                    break;
                }
            }
            
            infoDiv.innerHTML = `
                <strong>${selectedMt}</strong><br>
                <div class="dependency-note">
                    📂 Category: ${category}
                </div>
            `;
            infoDiv.style.display = 'block';
        }
        
        function updateCompatibilityStatus() {
            const selectedAsr = document.getElementById('asrSelect').value;
            const selectedMt = document.getElementById('mtSelect').value;
            const asrInfo = providerData.dependencies?.asr_mt_compatibility[selectedAsr];
            const statusDiv = document.getElementById('compatibilityStatus');
            const detailsDiv = document.getElementById('compatibilityDetails');
            
            if (!asrInfo) return;
            
            const requiresMt = asrInfo.requires_mt !== false;
            const recommended = asrInfo.recommended_mt;
            const compatible = asrInfo.compatible_mt || [];
            
            let status = '';
            let statusClass = '';
            
            if (!requiresMt) {
                status = '✅ Perfect Match - ASR handles translation internally';
                statusClass = 'status-optimal';
            } else if (selectedMt === recommended) {
                status = '✅ Optimal Configuration - Using recommended MT provider';
                statusClass = 'status-optimal';
            } else if (compatible.includes(selectedMt)) {
                status = '⚠️ Compatible but not optimal - Consider switching to recommended MT';
                statusClass = 'status-warning';
            } else {
                status = '❌ Incompatible Configuration - This combination may not work';
                statusClass = 'status-error';
            }
            
            detailsDiv.innerHTML = `
                <div class="status-indicator ${statusClass}"></div>
                ${status}
                ${requiresMt ? `<br><small>💡 Tip: ${recommended} is optimized for ${selectedAsr}</small>` : ''}
            `;
            
            statusDiv.style.display = 'block';
        }
        
        // Load data when page loads
        window.addEventListener('load', loadProviderData);
    </script>
</body>
</html>
