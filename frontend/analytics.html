<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics - Live Seminar Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@100..900&family=Noto+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .analytics-dashboard {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .dashboard-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .dashboard-title {
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(135deg, var(--accent), #10b981);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .stats-overview {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: var(--panel);
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 12px;
            padding: 24px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--accent), #10b981);
        }

        .stat-number {
            font-size: 2.5rem;
            font-weight: bold;
            color: var(--accent);
            margin-bottom: 8px;
            display: block;
        }

        .stat-label {
            font-size: 0.9rem;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-change {
            font-size: 0.8rem;
            margin-top: 8px;
        }

        .stat-change.positive {
            color: #10b981;
        }

        .stat-change.negative {
            color: #f87171;
        }

        .charts-section {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 30px;
            margin-bottom: 40px;
        }

        .chart-container {
            background: var(--panel);
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 12px;
            padding: 24px;
        }

        .chart-title {
            font-size: 1.3rem;
            margin-bottom: 20px;
            color: var(--text);
        }

        .chart-canvas {
            width: 100%;
            height: 300px;
        }

        .events-section {
            background: var(--panel);
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 12px;
            padding: 24px;
        }

        .events-list {
            max-height: 400px;
            overflow-y: auto;
        }

        .event-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            border-bottom: 1px solid rgba(148, 163, 184, 0.1);
        }

        .event-item:last-child {
            border-bottom: none;
        }

        .event-type {
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .event-join {
            background: rgba(52, 211, 153, 0.2);
            color: var(--accent);
        }

        .event-leave {
            background: rgba(248, 113, 113, 0.2);
            color: #f87171;
        }

        .event-time {
            font-size: 0.8rem;
            color: var(--muted);
        }

        .refresh-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .refresh-button {
            padding: 8px 16px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
        }

        .refresh-button:hover {
            background: #10b981;
        }

        .time-filter {
            display: flex;
            gap: 8px;
        }

        .filter-btn {
            padding: 6px 12px;
            background: var(--bg);
            border: 1px solid rgba(148, 163, 184, 0.3);
            border-radius: 6px;
            color: var(--text);
            cursor: pointer;
            font-size: 0.8rem;
        }

        .filter-btn.active {
            background: var(--accent);
            border-color: var(--accent);
            color: white;
        }

        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid transparent;
            border-top: 2px solid var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @media (max-width: 768px) {
            .charts-section {
                grid-template-columns: 1fr;
            }

            .stats-overview {
                grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            }
        }
    </style>
</head>
<body>
    <header class="app-header">
        <div>
            <h1>📊 Analytics</h1>
            <p class="subtitle">Real-time participant statistics and engagement metrics</p>
        </div>
        <div class="header-controls">
            <div id="userInfo" class="user-info-container">
                <span id="welcomeText" class="welcome-text">Loading...</span>
                <button id="logoutBtn" class="logout-button">
                    <span class="icon">�</span>
                    <span>Logout</span>
                </button>
            </div>
            <button onclick="location.href='/dashboard'" class="secondary-button">
                <span class="icon">🏠</span>
                <span>Dashboard</span>
            </button>
            <button onclick="location.href='/settings'" class="secondary-button">
                <span class="icon">⚙️</span>
                <span>Settings</span>
            </button>
        </div>
    </header>

    <main class="app-main">
        <div class="analytics-dashboard">

        <div class="refresh-controls">
            <div class="time-filter">
                <button class="filter-btn" data-hours="1">1H</button>
                <button class="filter-btn" data-hours="6">6H</button>
                <button class="filter-btn active" data-hours="24">24H</button>
                <button class="filter-btn" data-hours="168">7D</button>
            </div>
            <button class="refresh-button" onclick="refreshData()">
                <span id="refreshIcon">🔄</span> Refresh
            </button>
        </div>

        <div class="stats-overview" id="statsOverview">
            <div class="stat-card">
                <span class="stat-number" id="currentParticipants">-</span>
                <span class="stat-label">Current Participants</span>
                <div class="stat-change" id="currentChange"></div>
            </div>
            <div class="stat-card">
                <span class="stat-number" id="totalParticipants">-</span>
                <span class="stat-label">Total Participants</span>
                <div class="stat-change" id="totalChange"></div>
            </div>
            <div class="stat-card">
                <span class="stat-number" id="peakParticipants">-</span>
                <span class="stat-label">Peak Participants</span>
                <div class="stat-change" id="peakChange"></div>
            </div>
            <div class="stat-card">
                <span class="stat-number" id="totalEvents">-</span>
                <span class="stat-label">Total Events</span>
                <div class="stat-change" id="eventsChange"></div>
            </div>
        </div>

        <div class="charts-section">
            <div class="chart-container">
                <h3 class="chart-title">Participant Activity Over Time</h3>
                <canvas id="participantChart" class="chart-canvas"></canvas>
            </div>
            <div class="chart-container">
                <h3 class="chart-title">Join vs Leave Events</h3>
                <canvas id="eventsChart" class="chart-canvas"></canvas>
            </div>
        </div>

        <div class="events-section">
            <h3 class="chart-title">Recent Activity</h3>
            <div class="events-list" id="eventsList">
                <div class="loading-spinner"></div>
            </div>
        </div>
        </div>
    </main>

    <script src="/static/auth.js"></script>
    <script src="/static/analytics-dashboard.js"></script>
</body>
</html>
