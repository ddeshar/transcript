services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: en-th-subtitles
    env_file:
      - ../.env.docker
    ports:
      - "8000:8000"
    volumes:
      - ../models:/app/models
      - ../sample_audio:/app/sample_audio:ro
      - ../frontend:/app/frontend:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: en-th-subtitles-frontend
    depends_on:
      - app
    ports:
      - "5173:80"
    restart: unless-stopped
