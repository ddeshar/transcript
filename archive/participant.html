<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join Seminar Room - Participant Access</title>
    <link rel="stylesheet" href="/static/styles.css">
    <style>
        .participant-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: var(--bg-primary);
            padding: 2rem;
        }
        
        .participant-header {
            text-align: center;
            margin-bottom: 3rem;
        }
        
        .participant-title {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--text-primary);
            margin: 0 0 0.5rem 0;
            background: linear-gradient(135deg, var(--primary-color), #45a049);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .participant-subtitle {
            font-size: 1.1rem;
            color: var(--text-muted);
            margin: 0;
        }
        
        .join-section {
            background: var(--bg-secondary);
            border-radius: 12px;
            padding: 2.5rem;
            margin-bottom: 2rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            border: 1px solid var(--border-color);
        }
        
        .join-title {
            font-size: 1.3rem;
            font-weight: 600;
            color: var(--text-primary);
            margin: 0 0 1.5rem 0;
            text-align: center;
        }
        
        .join-form {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }
        
        .room-input {
            flex: 1;
            padding: 0.75rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: var(--input-bg);
            color: var(--text-primary);
            font-size: 1rem;
        }
        
        .room-input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(76, 175, 80, 0.1);
        }
        
        .join-btn {
            padding: 0.75rem 1.5rem;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .join-btn:hover {
            background: var(--primary-color-dark);
            transform: translateY(-1px);
        }
        
        .room-list {
            background: var(--bg-secondary);
            border-radius: 12px;
            padding: 2rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            border: 1px solid var(--border-color);
        }
        
        .room-list-title {
            font-size: 1.3rem;
            font-weight: 600;
            color: var(--text-primary);
            margin: 0 0 1.5rem 0;
            text-align: center;
        }
        
        .room-card {
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 1.5rem;
            margin-bottom: 1rem;
            transition: all 0.3s ease;
        }
        
        .room-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            border-color: var(--primary-color);
        }
        
        .room-card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 1rem;
        }
        
        .room-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-primary);
            margin: 0;
        }
        
        .room-status {
            padding: 0.25rem 0.75rem;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 500;
        }
        
        .status-live {
            background: #e8f5e8;
            color: #2e7d32;
            border: 1px solid #4caf50;
        }
        
        .status-waiting {
            background: #fff3e0;
            color: #f57c00;
            border: 1px solid #ff9800;
        }
        
        .room-meta {
            display: flex;
            gap: 1rem;
            margin-bottom: 1rem;
            font-size: 0.9rem;
            color: var(--text-muted);
        }
        
        .room-actions {
            display: flex;
            gap: 0.5rem;
        }
        
        .join-room-btn {
            padding: 0.5rem 1rem;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            text-align: center;
        }
        
        .join-room-btn:hover {
            background: var(--primary-color-dark);
        }
        
        .admin-link {
            text-align: center;
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 1px solid var(--border-color);
        }
        
        .admin-link a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 500;
        }
        
        .admin-link a:hover {
            text-decoration: underline;
        }
        
        .no-rooms {
            text-align: center;
            padding: 2rem;
            color: var(--text-muted);
        }
        
        .loading {
            text-align: center;
            padding: 2rem;
            color: var(--text-muted);
        }
        
        @media (max-width: 768px) {
            .participant-container {
                padding: 1rem;
            }
            
            .join-form {
                flex-direction: column;
            }
            
            .room-card-header {
                flex-direction: column;
                gap: 0.5rem;
                align-items: stretch;
            }
        }
    </style>
</head>
<body>
    <div class="participant-container">
        <div class="participant-header">
            <h1 class="participant-title">Live Seminar Platform</h1>
            <p class="participant-subtitle">Join live seminars with real-time English to Thai subtitles</p>
        </div>

        <div class="join-section">
            <h2 class="join-title">Join with Room ID</h2>
            <div class="join-form">
                <input 
                    type="text" 
                    id="roomIdInput" 
                    class="room-input" 
                    placeholder="Enter Room ID (e.g., ABC123)"
                    maxlength="20"
                >
                <button id="joinByIdBtn" class="join-btn">Join Room</button>
            </div>
            <p style="text-align: center; color: var(--text-muted); font-size: 0.9rem;">
                Enter the Room ID provided by your seminar organizer
            </p>
        </div>

        <div class="room-list">
            <h2 class="room-list-title">Available Rooms</h2>
            <div id="roomListContainer">
                <div class="loading">Loading available rooms...</div>
            </div>
        </div>

        <div class="admin-link">
            <p>Are you a seminar organizer? <a href="/login">Login to Admin Panel</a></p>
        </div>
    </div>

    <script>
        class ParticipantManager {
            constructor() {
                this.roomListContainer = document.getElementById('roomListContainer');
                this.roomIdInput = document.getElementById('roomIdInput');
                this.joinByIdBtn = document.getElementById('joinByIdBtn');
                
                this.bindEvents();
                this.loadAvailableRooms();
            }
            
            bindEvents() {
                this.joinByIdBtn.addEventListener('click', () => this.joinByRoomId());
                this.roomIdInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') {
                        this.joinByRoomId();
                    }
                });
                
                // Auto-format room ID input
                this.roomIdInput.addEventListener('input', (e) => {
                    let value = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
                    e.target.value = value;
                });
            }
            
            async loadAvailableRooms() {
                try {
                    const response = await fetch('/api/rooms');
                    if (response.ok) {
                        const data = await response.json();
                        this.renderRooms(data.rooms || []);
                    } else {
                        this.showError('Failed to load rooms');
                    }
                } catch (error) {
                    console.error('Error loading rooms:', error);
                    this.showError('Network error loading rooms');
                }
            }
            
            renderRooms(rooms) {
                if (!rooms || rooms.length === 0) {
                    this.roomListContainer.innerHTML = `
                        <div class="no-rooms">
                            <p>No active rooms available at the moment.</p>
                            <p>Contact your seminar organizer for the Room ID.</p>
                        </div>
                    `;
                    return;
                }
                
                const roomsHtml = rooms
                    .filter(room => room.is_live) // Only show live rooms
                    .map(room => this.createRoomCard(room))
                    .join('');
                
                if (roomsHtml) {
                    this.roomListContainer.innerHTML = roomsHtml;
                } else {
                    this.roomListContainer.innerHTML = `
                        <div class="no-rooms">
                            <p>No live rooms available at the moment.</p>
                            <p>Rooms will appear here when seminars start.</p>
                        </div>
                    `;
                }
            }
            
            createRoomCard(room) {
                const createdDate = new Date(room.created_at).toLocaleDateString();
                const participantCount = room.participant_count || 0;
                
                return `
                    <div class="room-card">
                        <div class="room-card-header">
                            <h3 class="room-title">${this.escapeHtml(room.title)}</h3>
                            <span class="room-status ${room.is_live ? 'status-live' : 'status-waiting'}">
                                ${room.is_live ? 'LIVE' : 'Waiting'}
                            </span>
                        </div>
                        <div class="room-meta">
                            <span>👥 ${participantCount} participants</span>
                            <span>📅 Created ${createdDate}</span>
                            <span>🔗 ID: ${room.room_id}</span>
                        </div>
                        <div class="room-actions">
                            <a href="/room/${room.room_id}" class="join-room-btn">
                                Join Room
                            </a>
                        </div>
                    </div>
                `;
            }
            
            joinByRoomId() {
                const roomId = this.roomIdInput.value.trim();
                if (!roomId) {
                    alert('Please enter a Room ID');
                    this.roomIdInput.focus();
                    return;
                }
                
                // Navigate to room
                window.location.href = `/room/${roomId}`;
            }
            
            showError(message) {
                this.roomListContainer.innerHTML = `
                    <div class="no-rooms">
                        <p style="color: #f44336;">${message}</p>
                        <button onclick="location.reload()" style="
                            margin-top: 1rem;
                            padding: 0.5rem 1rem;
                            background: var(--primary-color);
                            color: white;
                            border: none;
                            border-radius: 4px;
                            cursor: pointer;
                        ">Try Again</button>
                    </div>
                `;
            }
            
            escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }
        }

        // Initialize participant manager when page loads
        document.addEventListener('DOMContentLoaded', () => {
            new ParticipantManager();
        });
    </script>
</body>
</html>
